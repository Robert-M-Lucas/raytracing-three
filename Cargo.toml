[package]
name = "raytracing-three"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25.10"
chrono = "0.4.45"
num_cpus = "1.17.0"
rayon = "1.6.1"
rand = "0.10.3"
num-traits = "0.2.19"
dyn-clone = "1.0.20"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
zip = "9.1.0"

[target.'cfg(windows)'.dependencies.sdl2]
version = "0.38.0"
default-features = false
features = ["bundled"]

[target.'cfg(not(windows))'.dependencies.sdl2]
version = "0.38.0"
default-features = false
features = ["use-pkgconfig"]

[build-dependencies]
fs_extra = "1.3.0"
